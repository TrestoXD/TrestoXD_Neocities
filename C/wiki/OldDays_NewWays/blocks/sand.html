    <main style="display: flex; padding: 0; flex-wrap: wrap; gap: 8px; max-width: 760px;">
        <h1>Sand</h1>
        <hr>
        <p>Sand is a gravity-affected block found abundantly in deserts and beaches, and less commonly in or near surface water. </p>
        <h2>Recipe</h2>
        <hr>
        <section style="display: flex;">
        <p>You can easily gather sand putting it on a stone cutter with Gravel!</p>
        <table class="inventory-ui" style="width: fit-content; display: flex; flex-direction: column; scale: 1.25; margin-left: 50px; margin-right: 50px;">
            <tbody style="margin: 6px;">
                <tr>
                    <td style="border: none;">
                        <div class="crafting-table-ui" style="border: none;">
                            
                            <div class="result-slot" style="margin-right: 20px; width: 32px; height: 32px;">
                                <span class="no-external-icon" style="width: 16px; height: 16px; position: relative;"> <img src="https://minecraft.wiki/images/Gravel_JE2_BE1.png?438ac" style="padding: 0px; width: 32px; height: 32px;"></span>  
                            </div>
                            <div style="display: inline-grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: (4, 1fr); width: 144px; height: 108px; padding: 3px; background-color: #51493a;">
                                <div class="inventory-slot" style="border-color: #51493a; border-left-color: #e0ca9f; border-top-color: #e0ca9f; background-color: #a09172;">
                                    <span class="no-external-icon" style="width: 36px; height: 36px;"> <img src="https://minecraft.wiki/images/Sand_JE3_BE2.png?5e564" alt="leaves"></span>    
                                </div>
                                
                            </div>
                            <span style="margin-left: 6px; margin-right: 6px; pointer-events: none; user-select: none;">
                                <img class="" src="result_arrow.png" width="44" height="30">
                            </span>
                            <div class="result-slot">
                                <span class="no-external-icon" style="width: 44px; height: 44px; position: relative;"> <img src="https://minecraft.wiki/images/Sand_JE3_BE2.png?438ac" style="padding: 5px; width: 32px; height: 32px;"></span>  
                            </div>
                        </div>

                </tr>
