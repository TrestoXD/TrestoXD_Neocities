<!DOCTYPE html>

    <header>

    <main style="display: flex; flex-direction: column; justify-content: center; padding: 0; flex-wrap: wrap; gap: 8px; max-width: 760px;">
        <div>
            <section>
            <h1>Leather</h1>
            <hr>
            <p><b>Leather</b> is an item which is used to craft items as books, armor and bundles. </p>
            </section>
            <img src="../leather.png" alt="enchanting table" width="400" class="crafting-table-ui" style="margin: 15px;">
        </div>
        <br>

        <hr>
        <h3>Smoking</h3>
        <hr>
        <table class="inventory-ui" style="width: fit-content; display: flex; flex-direction: column;">
            <tbody style="margin: 6px;">
                <tr>
                    <th style="border: none; padding-right: 12px; width: 152px;" >Using a smoker, you can turn rotten flesh into leather</th>
                    <td style="border: none;">
                        <div class="crafting-table-ui" style="border: none;">
                            <div style="display: inline-grid; grid-template-columns: repeat(1, 1fr); grid-template-rows: (1, 1fr);">
                                
                                <div class="inventory-slot">
                                    <span class="no-external-icon" style="width: 36px; height: 36px;"> <img src="https://minecraft.wiki/images/Rotten_Flesh_JE2_BE1.png?cc185"> </span>    
                                </div>
                                <div class="">
                                    <span class="no-external-icon" style="width: 36px; height: 36px;"> <img src="https://minecraft.wiki/images/Grid_layout_Fire.png?84fd9"></span>    
                                </div>
                                <div class="inventory-slot">
                                    <span class="no-external-icon" style="width: 36px; height: 36px;"> <img src="https://minecraft.wiki/images/Coal_JE4_BE3.png?165e9"></span>    
                                </div>
                            </div>
                            <span style="margin-left: 6px; margin-right: 6px; pointer-events: none; user-select: none;">
                                <img class="" src="../result_arrow.png" width="44" height="30">
                            </span>
                            <div class="result-slot">
                                <span class="no-external-icon" style="width: 44px; height: 44px; position: relative;"> <img src="https://minecraft.wiki/images/Leather_JE2_BE2.png?10fae" style="padding: 5px; width: 32px; height: 32px;"></span>  
                            </div>
                        </div>
                    </td>
                </tr>

            <tfoot></tfoot>
        </table>
